services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your shell or .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/Quanlydetaisinhvien.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/migrations/pending/V002__phanconghoidong_emailketqua.sql:/docker-entrypoint-initdb.d/02-v002.sql:ro
      - ./database/migrations/pending/V003__emailthongbao.sql:/docker-entrypoint-initdb.d/03-v003.sql:ro    
      - ./database/migrations/pending/V004__thongbao_doituong.sql:/docker-entrypoint-initdb.d/04-v004.sql:ro
      - ./database/migrations/pending/V005__thongbao_dadoc.sql:/docker-entrypoint-initdb.d/05-v005.sql:ro
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    environment:
      DB_URL: jdbc:mysql://db:3306/Quanlydetaisinhvien?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      PORT: 8080
      KETQUA_EMAIL_ENABLED: "false"
      THONGBAO_EMAIL_DELIVERY_ENABLED: "false"
      THONGBAO_EMAIL_OUTBOX_ENABLED: "false"
      UPLOAD_DIR: /app/uploads/baocao
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
