# Explicit local testing of ONE result email. Delivery is OFF by default.
# Shared Mailjet HTTPS credentials and the result opt-in switch are in application.properties.
spring.datasource.url=jdbc:mysql://${DEMO_DB_HOST:127.0.0.1}:${DEMO_DB_PORT:3306}/quanlydetaisinhvien_demo
spring.datasource.username=${DEMO_DB_USERNAME:}
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.mail.test-connection=false
server.port=${DEMO_PORT:8081}


# Result delivery requires exactly one outbox ID plus one matching snapshot address.
# Activating this profile enforces scope even if test-mode is overridden elsewhere.
app.ketqua.email.test-mode=true
app.ketqua.email.poll-ms=${KETQUA_EMAIL_POLL_MS:3000}
