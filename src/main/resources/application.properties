spring.application.name=quanlydetaisinhvien

# Local: mac dinh ket noi MySQL tren may
# Deploy: dat bien moi truong DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Quanlydetaisinhvien}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email transport is opt-in. Tests replace it with a fake sender.
app.ketqua.email.enabled=${KETQUA_EMAIL_ENABLED:false}
app.ketqua.email.scheduling-enabled=${KETQUA_EMAIL_ENABLED:false}
app.ketqua.email.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Notification emails are independent from result emails.
# Keep disabled for Module 15.
app.thongbao.email.outbox-enabled=${THONGBAO_EMAIL_OUTBOX_ENABLED:false}
app.thongbao.email.delivery-enabled=${THONGBAO_EMAIL_DELIVERY_ENABLED:false}
app.thongbao.email.schedule-enabled=${THONGBAO_EMAIL_SCHEDULE_ENABLED:false}
app.thongbao.email.mode=${THONGBAO_EMAIL_MODE:ALLOWLIST}
app.thongbao.email.allowlist=${THONGBAO_EMAIL_ALLOWLIST:}
app.thongbao.email.student-id=${THONGBAO_EMAIL_STUDENT_ID:0}
app.thongbao.email.notice-id=${THONGBAO_EMAIL_NOTICE_ID:0}
app.thongbao.email.batch-size=${THONGBAO_EMAIL_BATCH_SIZE:10}
app.thongbao.email.min-interval-ms=${THONGBAO_EMAIL_MIN_INTERVAL_MS:1000}
app.thongbao.email.poll-ms=${THONGBAO_EMAIL_POLL_MS:60000}
app.thongbao.email.claim-ttl-seconds=900
app.thongbao.email.smtp.host=${THONGBAO_SMTP_HOST:}
app.thongbao.email.smtp.port=${THONGBAO_SMTP_PORT:587}
app.thongbao.email.smtp.username=${THONGBAO_SMTP_USERNAME:}
app.thongbao.email.smtp.password=${THONGBAO_SMTP_PASSWORD:}
app.thongbao.email.smtp.from=${THONGBAO_SMTP_FROM:}
app.thongbao.email.smtp.auth=${THONGBAO_SMTP_AUTH:true}
app.thongbao.email.smtp.starttls=${THONGBAO_SMTP_STARTTLS:true}

app.upload.dir=${UPLOAD_DIR:uploads/baocao}
