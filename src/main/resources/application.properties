
spring.application.name=quanlydetaisinhvien

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Quanlydetaisinhvien}
spring.datasource.username=root
spring.datasource.password=Hongthao@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email transport is opt-in. Tests replace it with a fake sender.
app.ketqua.email.enabled=${KETQUA_EMAIL_ENABLED:false}
app.ketqua.email.scheduling-enabled=${KETQUA_EMAIL_ENABLED:false}
# Local Mailjet tests must select one existing outbox row and one approved snapshot address.
app.ketqua.email.test-mode=${KETQUA_EMAIL_TEST_MODE:false}
app.ketqua.email.outbox-id=${KETQUA_EMAIL_OUTBOX_ID:0}
app.ketqua.email.allowlist=${KETQUA_EMAIL_ALLOWLIST:}

# Mailjet Send API v3.1 qua HTTPS (Port 443 - hoat dong on dinh tren Render Free)
app.mailjet.api-key=${MAILJET_API_KEY:}
app.mailjet.secret-key=${MAILJET_SECRET_KEY:}
app.mailjet.from-email=${MAILJET_FROM_EMAIL:}
app.mailjet.from-name=${MAILJET_FROM_NAME:HCMUTE - Khoa CNTT}

app.email.base-url=${APP_PUBLIC_URL:https://hethongqldtsv-cntt.onrender.com}

# Web application
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads/baocao}
server.tomcat.max-swallow-size=-1

# ===== PERFORMANCE - RENDER =====

# Compress HTTP responses
server.compression.enabled=true
server.compression.min-response-size=2KB

# Cache static CSS, JS, images in browser
spring.web.resources.cache.period=10m

# Limit MySQL connections for a small Render instance
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# Slow request logging
app.performance.slow-request-ms=${SLOW_REQUEST_MS:800}
