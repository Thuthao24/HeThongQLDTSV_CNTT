
spring.application.name=quanlydetaisinhvien

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Quanlydetaisinhvien}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Result email configuration
app.ketqua.email.enabled=${KETQUA_EMAIL_ENABLED:false}
app.ketqua.email.scheduling-enabled=${KETQUA_EMAIL_ENABLED:false}
app.ketqua.email.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Web application
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads/baocao}

# Module 15 - Website-only notifications
app.thongbao.email.outbox-enabled=${THONGBAO_EMAIL_OUTBOX_ENABLED:false}
app.thongbao.email.delivery-enabled=${THONGBAO_EMAIL_DELIVERY_ENABLED:false}
app.thongbao.email.schedule-enabled=${THONGBAO_EMAIL_SCHEDULE_ENABLED:false}

# ===== PERFORMANCE - RENDER =====

# Compress HTTP responses
server.compression.enabled=true
server.compression.min-response-size=2KB

# Cache static CSS, JS, images in browser
spring.web.resources.cache.period=10m

# Limit MySQL connections for a small Render instance
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# Slow request logging
app.performance.slow-request-ms=${SLOW_REQUEST_MS:800}
