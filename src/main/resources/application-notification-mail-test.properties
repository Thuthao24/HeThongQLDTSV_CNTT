# Explicit opt-in test profile. Uses only the approved demo DB, never the original DB.
spring.datasource.url=jdbc:mysql://${DEMO_DB_HOST:127.0.0.1}:${DEMO_DB_PORT:3306}/quanlydetaisinhvien_demo
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.mail.test-connection=false
app.ketqua.email.enabled=false
app.ketqua.email.scheduling-enabled=false
app.thongbao.email.mode=ALLOWLIST
app.thongbao.email.batch-size=1
server.port=${DEMO_PORT:8081}
# The three notification switches still default to false in application.properties.
# Delivery additionally requires explicit student-id, notice-id and matching allowlist.
