# Explicit opt-in only: --spring.profiles.active=demo. No automatic schema/data initialization.
spring.datasource.url=jdbc:mysql://${DEMO_DB_HOST:127.0.0.1}:${DEMO_DB_PORT:3306}/quanlydetaisinhvien_demo
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# Literal false: KETQUA_EMAIL_ENABLED / SMTP_* from the normal profile cannot turn on delivery.
app.ketqua.email.enabled=false
app.ketqua.email.scheduling-enabled=false
app.ketqua.email.from=
spring.mail.host=
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false
server.port=${DEMO_PORT:8081}
