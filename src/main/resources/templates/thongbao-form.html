<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title != null ? title : 'Soạn thảo thông báo'}">Soạn thảo thông báo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: portalHeader}"></div>
    <div class="portal-body">
        <div th:replace="~{fragments :: sidebar('thongbao')}"></div>
        <main class="main-panel">
            <div class="page-heading">
                <div>
                    <div class="breadcrumb">
                        <span>Cổng thông tin đào tạo</span> / 
                        <a th:href="@{/thongbao}" style="color: inherit; text-decoration: underline;">Thông báo</a> / 
                        <span th:text="${formMode == 'EDIT' ? 'Chỉnh sửa' : 'Tạo mới'}">Soạn thảo</span>
                    </div>
                    <h1 th:text="${title != null ? #strings.toUpperCase(title) : (formMode == 'EDIT' ? 'CHỈNH SỬA THÔNG BÁO' : 'THÊM THÔNG BÁO MỚI')}">SOẠN THẢO THÔNG BÁO</h1>
                    <p th:text="${formMode == 'EDIT' ? 'Cập nhật tiêu đề và nội dung thông báo đã phát hành.' : 'Nhập thông tin để phát hành thông báo mới đến sinh viên và giảng viên.'}">Quản lý nội dung thông báo.</p>
                </div>
                <div>
                    <a th:href="@{/thongbao}" class="btn btn-secondary" title="Quay về danh sách thông báo">← Danh sách thông báo</a>
                </div>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="publication-message success" role="status" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="publication-message error" role="alert" th:text="${errorMessage}"></div>

            <section class="portal-form-card">
                <form th:action="@{${formAction}}" th:object="${thongbaoForm}" method="post">
                    <!-- Global validation errors -->
                    <div th:if="${#fields.hasGlobalErrors()}" class="publication-message error" role="alert">
                        <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi dữ liệu biểu mẫu</div>
                    </div>

                    <!-- Trường Tiêu đề -->
                    <div class="form-group">
                        <label for="tieude" class="form-label">
                            Tiêu đề thông báo <span class="required">*</span>
                        </label>
                        <input type="text"
                               id="tieude"
                               th:field="*{tieude}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('tieude')} ? ' is-invalid' : ''"
                               placeholder="Ví dụ: Lịch báo cáo khóa luận tốt nghiệp đợt 1 năm 2026..."
                               autofocus>
                        <div class="form-feedback-error"
                             th:if="${#fields.hasErrors('tieude')}"
                             th:errors="*{tieude}">
                            Tiêu đề không được để trống hoặc không hợp lệ.
                        </div>
                    </div>

                    <!-- Trường Nội dung -->
                    <div class="form-group">
                        <label for="noidung" class="form-label">
                            Nội dung thông báo <span class="required">*</span>
                        </label>
                        <textarea id="noidung"
                                  th:field="*{noidung}"
                                  class="form-control form-textarea"
                                  th:classappend="${#fields.hasErrors('noidung')} ? ' is-invalid' : ''"
                                  placeholder="Nhập nội dung chi tiết, các mốc thời gian, hướng dẫn nộp tài liệu hoặc yêu cầu cụ thể..."></textarea>
                        <div class="form-feedback-error"
                             th:if="${#fields.hasErrors('noidung')}"
                             th:errors="*{noidung}">
                            Nội dung thông báo không được để trống.
                        </div>
                    </div>

                    <!-- Nút thao tác -->
                    <div class="form-actions">
                        <button type="submit"
                                class="btn btn-primary"
                                th:text="${formMode == 'EDIT' ? 'Cập nhật thông báo' : 'Đăng thông báo'}">
                            Lưu thông báo
                        </button>
                        <a th:href="${thongbaoId != null ? '/thongbao/' + thongbaoId : '/thongbao'}"
                           class="btn btn-secondary">
                            Hủy bỏ
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
