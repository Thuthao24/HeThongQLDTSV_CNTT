<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ người dùng</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments :: portalHeader}"></div><div class="portal-body"><div th:replace="~{fragments :: sidebar('giangvien')}"></div><main class="main-panel"><div class="page-heading"><h1 th:text="${title}">Hồ sơ</h1><a th:href="${type == 'sinhvien' ? '/sinhvien' : '/giangvien'}">← Trở về</a></div><section class="panel-card" style="padding:24px;max-width:750px"><form th:action="@{/quanly/danhmuc/{type}/luu(type=${type})}" th:object="${form}" method="post"><input th:if="${id != null}" type="hidden" name="id" th:value="${id}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px"><label>Mã số (tên đăng nhập)<input th:if="${id == null}" th:field="*{ma}" required maxlength="20" style="width:100%"><input th:if="${id != null}" th:value="${form.ma}" disabled style="width:100%"></label><label>Họ tên<input th:field="*{hoten}" required maxlength="150" style="width:100%"></label><label>Email<input th:field="*{email}" type="email" style="width:100%"></label><label>Bộ môn<select th:field="*{bomonid}" required style="width:100%"><option value="">Chọn bộ môn</option><option th:each="b : ${bomons}" th:value="${b.id}" th:text="${b.tenbomon}"></option></select></label><label th:if="${type == 'giangvien'}">Vai trò<select th:field="*{vaitro}" style="width:100%"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></label><label th:if="${type == 'sinhvien'}">Lớp<input th:field="*{lop}" maxlength="50" style="width:100%"></label><label th:if="${id == null}">Mật khẩu khởi tạo (từ 8 ký tự)<input th:field="*{matkhau}" type="password" minlength="8" required autocomplete="new-password" style="width:100%"></label><label>Kích hoạt tài khoản<input th:field="*{kichhoat}" type="checkbox"></label></div><p style="margin-top:24px"><button class="btn btn-primary">Lưu thông tin</button></p></form></section></main></div></div><script th:src="@{/js/app.js}"></script></body></html>
