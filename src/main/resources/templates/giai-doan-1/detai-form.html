<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đề xuất đề tài</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><div th:replace="~{fragments :: portalHeader}"></div><div class="portal-body"><div th:replace="~{fragments :: sidebar('detai')}"></div><main class="main-panel">
<div class="page-heading"><div><div class="breadcrumb">Đề tài / Giai đoạn 1</div><h1 th:text="${title}">Đề xuất đề tài</h1><p>Đề tài được gửi CHỜ DUYỆT, cần từ 1 đến 2 giảng viên hướng dẫn.</p></div><a class="btn" th:href="@{/detai}">← Danh sách</a></div>
<section class="panel-card" style="padding:24px;max-width:880px"><p style="color:#b42318" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<form th:action="@{/giai-doan-1/detai/luu}" th:object="${form}" method="post">
<input type="hidden" name="id" th:if="${id != null}" th:value="${id}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px">
<label>Đợt đăng ký (đang GĐ1) <select th:field="*{dotdangkyid}" required class="form-control" style="width:100%"><option value="">Chọn đợt</option><option th:each="d : ${dots}" th:value="${d.id}" th:text="${d.tendot}"></option></select></label>
<label>Bộ môn <select th:field="*{bomonid}" required class="form-control" style="width:100%"><option value="">Chọn bộ môn</option><option th:each="b : ${bomons}" th:value="${b.id}" th:text="${b.tenbomon}"></option></select></label>
<label style="grid-column:1/-1">Tên đề tài <input th:field="*{tendetai}" required maxlength="255" class="form-control" style="width:100%"></label>
<label style="grid-column:1/-1">Mô tả <textarea th:field="*{mota}" rows="5" class="form-control" style="width:100%"></textarea></label>
<label>GV hướng dẫn 1 (bắt buộc) <select th:field="*{gvhd1}" required class="form-control" style="width:100%"><option value="">Chọn GV</option><option th:each="g : ${giangviens}" th:value="${g.id}" th:text="${(teacherLabels[g.taikhoanid] ?: g.magiangvien) + ' (' + g.magiangvien + ')'}"></option></select></label>
<label>GV hướng dẫn 2 (không bắt buộc) <select th:field="*{gvhd2}" class="form-control" style="width:100%"><option value="">Không có</option><option th:each="g : ${giangviens}" th:value="${g.id}" th:text="${(teacherLabels[g.taikhoanid] ?: g.magiangvien) + ' (' + g.magiangvien + ')'}"></option></select></label>
</div><div style="margin-top:20px"><button type="submit" class="btn btn-primary">Gửi đề xuất</button></div>
</form></section></main></div></div><script th:src="@{/js/app.js}"></script></body></html>
