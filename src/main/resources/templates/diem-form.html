<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Nhập điểm</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .form-card {
            background: #fff;
            border: 1px solid #d5d5d5;
            border-radius: 3px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            padding: 24px;
            max-width: 680px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: #3b4e68;
        }
        .form-group label span.req { color: #d9381e; }
        .form-control {
            height: 38px;
            padding: 0 10px;
            border: 1px solid #c5d0dc;
            border-radius: 2px;
            font-size: 12px;
            color: #2b394e;
            background: #fff;
            outline: none;
            width: 100%;
        }
        .form-control:focus {
            border-color: #06649a;
            box-shadow: 0 0 0 2px rgba(6,100,154,.12);
        }
        textarea.form-control {
            height: 90px;
            padding: 8px 10px;
            resize: vertical;
        }
        .rule-box {
            background: #fdfaf3;
            border-left: 4px solid #f0ad4e;
            border: 1px solid #f5e4c3;
            border-left-width: 4px;
            padding: 12px 16px;
            border-radius: 2px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #795548;
            max-width: 680px;
        }
        .rule-box strong {
            color: #a85d00;
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .alert-error {
            background: #fff0f0;
            color: #c94444;
            border: 1px solid #f2c8c8;
            padding: 10px 14px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 18px;
            max-width: 680px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e5e9f0;
        }
        .btn-cancel {
            background: #fff;
            color: #556274;
            border: 1px solid #c9d4df;
            padding: 0 16px;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            font-size: 11px;
            border-radius: 2px;
        }
        .btn-cancel:hover { background: #f2f5f8; }
    </style>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: portalHeader}"></div>
    <div class="portal-body">
        <div th:replace="~{fragments :: sidebar('diem')}"></div>
        <main class="main-panel">
            <div class="page-heading">
                <div>
                    <div class="breadcrumb">Cổng thông tin đào tạo / Chấm điểm</div>
                    <h1 th:text="${form.id != null ? 'CHỈNH SỬA ĐIỂM' : 'NHẬP ĐIỂM THÀNH PHẦN'}">NHẬP ĐIỂM THÀNH PHẦN</h1>
                    <p>Giảng viên chấm điểm thành phần cho từng đề tài nghiên cứu / khóa luận.</p>
                </div>
            </div>

            <!-- Báo lỗi nghiệp vụ nếu có -->
            <div th:if="${errorMessage}" class="alert-error">
                <strong>LỖI: </strong> <span th:text="${errorMessage}"></span>
            </div>

            <div class="form-card">
                <form th:action="@{${form.id != null ? '/diem/sua/' + form.id : '/diem/them'}}" method="post" th:object="${form}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group">
                        <label>Giảng viên chấm điểm</label>
                        <div style="padding: 8px 12px; background: #f8fafc; border: 1px solid #c5d0dc; border-radius: 2px; font-size: 12px; font-weight: 600; color: #1e293b;">
                            <span th:text="${currentLecturerName != null ? currentLecturerName : 'Giảng viên'}">Giảng viên</span>
                            <span style="font-size: 11px; color: #64748b;" th:if="${currentLecturerCode != null && !currentLecturerCode.isEmpty()}" th:text="' (' + ${currentLecturerCode} + ')'"></span>
                        </div>
                        <input type="hidden" th:field="*{giangvienid}" />
                    </div>

                    <div class="form-group">
                        <label>Đề tài đăng ký cần chấm <span class="req">*</span></label>
                        <select th:field="*{dangkydetaiid}" class="form-control" required>
                            <option value="">-- Chọn đề tài được phân công chấm --</option>
                            <option th:each="dk : ${dangkydetais}" th:value="${dk.id}" th:text="${dk.label}">Đăng ký 1</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Điểm số (Thang điểm 0 - 10) <span class="req">*</span></label>
                        <input type="number" step="0.01" min="0" max="10" th:field="*{diemso}" class="form-control"
                               placeholder="Nhập điểm từ 0.00 đến 10.00 (ví dụ: 8.5)" required />
                    </div>

                    <div class="form-group">
                        <label>Nhận xét / Đánh giá của giảng viên</label>
                        <textarea th:field="*{nhanxet}" class="form-control" maxlength="500"
                                  placeholder="Nhập nhận xét chi tiết về đề tài, nội dung báo cáo..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="height: 34px; padding: 0 20px; font-weight: 700;">
                            Lưu điểm
                        </button>
                        <a th:href="@{/diem}" class="btn-cancel">Hủy bỏ</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
