<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tài khoản</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div class="app-shell">
<div th:replace="~{fragments :: portalHeader}"></div>
<div class="portal-body">
<div th:replace="~{fragments :: sidebar('taikhoan')}"></div>
<main class="main-panel">
<div class="page-heading">
  <div><div class="breadcrumb">Cổng thông tin đào tạo / Tài khoản</div><h1>TÀI KHOẢN</h1><p>Quản lý tài khoản, vai trò và trạng thái sử dụng hệ thống.</p></div>
  <!-- Không hiển thị thao tác tạo tài khoản chưa có endpoint thực thi. -->
</div>
<section class="panel-card">
<div class="table-toolbar">
  <form class="search-box"th:action="@{/taikhoan/quanly}" method="get"><span>⌕</span><input type="search" name="q" th:value="${q}" placeholder="Tìm kiếm toàn bộ dữ liệu..."><button type="submit" class="btn">Tìm</button></form>
  <div class="record-count"><b th:text="${pageData.totalElements}">0</b> bản ghi</div>
</div>
<div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Tên đăng nhập</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th></tr></thead><tbody data-table-body>
<tr th:each="item : ${items}"><td th:text="${item.id}">---</td><td th:text="${item.tendangnhap}">---</td><td th:text="${item.hoten}">---</td><td th:text="${item.email}">---</td><td><span class="badge" th:text="${item.vaitro}">---</span></td><td><span class="badge" th:classappend="${item.kichhoat} ? ' badge-success' : ' badge-muted'" th:text="${item.kichhoat} ? 'Đang hoạt động' : 'Ngừng'">---</span></td></tr>
<tr th:if="${#lists.isEmpty(items)}"><td colspan="6"><div class="empty-state"><strong>Chưa có dữ liệu</strong><span>Danh sách hiện chưa có bản ghi.</span></div></td></tr>
</tbody></table></div>
<nav th:if="${pageData.totalPages > 1}" class="pagination" aria-label="Phân trang" style="display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:14px;flex-wrap:wrap">
 <a th:if="${pageData.hasPrevious()}" th:href="@{/taikhoan/quanly(page=${pageData.number - 1},q=${q})}">← Trang trước</a>
 <span th:text="|Trang ${pageData.number + 1}/${pageData.totalPages} — ${pageData.totalElements} bản ghi|">Trang 1</span>
 <a th:if="${pageData.hasNext()}" th:href="@{/taikhoan/quanly(page=${pageData.number + 1},q=${q})}">Trang sau →</a>
</nav>
</section>
</main></div></div><script th:src="@{/js/app.js}"></script></body></html>
