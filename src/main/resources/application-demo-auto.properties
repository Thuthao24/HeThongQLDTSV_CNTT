# Profile demo-auto: runs on quanlydetaisinhvien_demo with automatic notification email delivery.
spring.datasource.url=jdbc:mysql://${DEMO_DB_HOST:127.0.0.1}:${DEMO_DB_PORT:3306}/quanlydetaisinhvien_demo
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# Module 16 remains completely disabled
app.ketqua.email.enabled=false
app.ketqua.email.scheduling-enabled=false
app.ketqua.email.from=
spring.mail.test-connection=false
server.port=${DEMO_PORT:8081}

# Notification email settings
app.thongbao.email.outbox-enabled=true
app.thongbao.email.delivery-enabled=true
app.thongbao.email.schedule-enabled=true
app.thongbao.email.mode=ALLOWLIST
app.thongbao.email.allowlist=hnghi.dong01@gmail.com
app.thongbao.email.student-id=1
app.thongbao.email.batch-size=1
app.thongbao.email.poll-ms=3000
app.thongbao.email.min-interval-ms=1000
app.thongbao.email.claim-ttl-seconds=900
app.thongbao.email.base-url=http://localhost:8081

# SMTP settings from environment
app.thongbao.email.smtp.host=smtp.gmail.com
app.thongbao.email.smtp.port=587
app.thongbao.email.smtp.username=${THONGBAO_SMTP_USERNAME:}
app.thongbao.email.smtp.password=${THONGBAO_SMTP_PASSWORD:}
app.thongbao.email.smtp.from=${THONGBAO_SMTP_FROM:}
app.thongbao.email.smtp.auth=true
app.thongbao.email.smtp.starttls=true
